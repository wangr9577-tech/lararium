version: '3.8'

services:
  kruskal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kruskal-app
    restart: unless-stopped
    ports:
      - "${KRUSKAL_HOST:-127.0.0.1}:8000:8000"
    environment:
      - KRUSKAL_DATA_DIR=/app/data
    volumes:
      - kruskal_data:/app/data

volumes:
  kruskal_data:
    driver: local
